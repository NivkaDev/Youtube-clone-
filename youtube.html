<!DOCTYPE html>
<html>
  <head>
    <title>YouTbe yb.com Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      p{
        font-family: Roboto,Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .thumbnail {
        width: 300px;
        display: block;
      }

      .search-bar {
        display: block;
      }
      .video-title{
        font-family: Arial;
        margin-top: 0px;
        font-weight: 500;
        font-size: 14px;
        line-height: 20px;
        margin-bottom: 12px;
      }

      .video-preview {
        width: 300px;
        display: inline-block;
        vertical-align: top;
        margin-right: 15px;
        margin-bottom: 12px;
      }
      .video-author, .video-stats{
        font-size: 12px;
        color: rgb(96, 96, 96);
        display: inline-block;
      }
      .video-author{
        margin-bottom: 4px;
        display: inline-block;
      }
      
      .icon1 {
        display: inline-block;
       
        vertical-align: top;
      }
      .video-info{
        width: 200px;
        display: inline-block;
      }
      .pect{
        width: 50px;
        border-radius: 25px;
        display: inline-block;

      }
      .thum-row{
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <input class="search-bar" type="text" placeholder="Search">

    <div class="video-preview">
      <div class="thum-row"><img class="thumbnail" src="/githubs/youtube copy/thumbnail-1.webp"></div> 
      <div class="icon1"><img class="pect" src="/githubs/youtube copy/channel-1.jpeg"></div>

 
      <div class="video-info">
        <p class="video-title">
         Talking Tech and AI with Google CEO Sundar Pichai!
        </p>
        <p class="video-author">
         Marques Brownlee
        </p>
        <p class="video-stats">
          3.4M views &#183; 6 months ago
        </p>     
      </div>
      
      
    </div>
    <div class="video-preview">
      <div class="thum-row"><img class="thumbnail" src="/githubs/youtube copy/thumbnail-2.webp"></div> 
      <div class="icon1"><img class="pect" src="/githubs/youtube copy/channel-2.jpeg"></div>

 
      <div class="video-info">
        <p class="video-title">
         Try Not To Laugh Challenge #9 
        </p>
        <p class="video-author">
          Markiplier super
        </p>
        <p class="video-stats">
          19M views &#183; 4 years ago   
        </p>     
      </div>
      
      
    </div>
  </body>
</html>
